name: KairoSeed August Pipeline v0.1

on:
  push:
    branches:
      - prototype/august-pipeline-v0.1
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/august-pipeline-v0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run invariant tests
        run: python -m unittest -v
      - name: Run prototype
        run: python pipeline.py
