name: KAIROSEED-GaaS

on:
  push:
    branches:
      - main
      - "prototype/kairoseed-gaas-v0.1"
  pull_request:
    paths:
      - "prototypes/kairoseed-gaas-v0.1/**"
      - ".github/workflows/kairoseed-gaas.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/kairoseed-gaas-v0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q .
      - name: Run full test suite
        run: python -m pytest -q
      - name: Verify production gate metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("PRODUCTION_READINESS.md").read_text()
          required = ["CI_GREEN", "DURABLE_EVIDENCE", "CONCURRENCY_SAFE", "FAILURE_SAFE", "DEPLOYMENT_CONTROLS", "PROVENANCE"]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"Missing production gate metadata: {missing}")
          print("Production gate metadata present")
          PY
      - name: Record immutable run identity
        run: |
          printf 'COMMIT=%s\n' "$GITHUB_SHA"
          printf 'WORKFLOW=%s\n' "$GITHUB_WORKFLOW"
          printf 'RUN_ID=%s\n' "$GITHUB_RUN_ID"
