name: KAIROSEED-GaaS

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "prototypes/kairoseed-gaas-v0.1/**"
      - ".github/workflows/kairoseed-gaas.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/kairoseed-gaas-v0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
