name: verification

on:
  push:
    branches: ["main", "release/**"]
  pull_request:

jobs:
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Run reference tests
        run: python -m pytest -q

      - name: Run adversarial tests
        run: python -m pytest -q tests/adversarial

      - name: Run safe example
        run: python examples/authorized_unauthorized.py

  release-claims:
    runs-on: ubuntu-latest
    needs: python-reference
    steps:
      - uses: actions/checkout@v4
      - name: Verify required release documentation exists
        run: |
          test -f docs/RELEASE_STATUS.md
          test -f docs/INVARIANTS.md
          test -f docs/VERIFICATION.md
          test -f docs/SECURITY_MODEL.md
          test -f docs/RELEASE_CHECKLIST.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f CHANGELOG.md
