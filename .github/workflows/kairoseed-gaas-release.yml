name: KAIROSEED-GaaS Release Gate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        working-directory: prototypes/kairoseed-gaas-v0.1
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile
        working-directory: prototypes/kairoseed-gaas-v0.1
        run: python -m compileall -q .

      - name: Full verification suite
        working-directory: prototypes/kairoseed-gaas-v0.1
        run: python -m pytest -q

      - name: Build release artifact
        run: |
          tar -czf kairoseed-gaas-v0.1-${GITHUB_SHA}.tar.gz prototypes/kairoseed-gaas-v0.1
          sha256sum kairoseed-gaas-v0.1-${GITHUB_SHA}.tar.gz | tee SHA256SUMS

      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: kairoseed-gaas-v0.1-${{ github.sha }}.tar.gz

      - name: Emit release decision inputs
        run: |
          echo "RELEASE_COMMIT=${GITHUB_SHA}"
          echo "ARTIFACT_SHA256=$(cut -d' ' -f1 SHA256SUMS)"
          echo "INDEPENDENT_VERIFICATION=PASS"

  deployment:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Production deployment gate
        run: |
          echo "Production environment gate reached."
          echo "Deployment requires the repository environment's configured reviewers/controls."
