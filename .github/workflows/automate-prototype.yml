name: automate-prototype

on:
  push:
    paths:
      - 'automate-prototype/**'
      - '.github/workflows/automate-prototype.yml'
  pull_request:
    paths:
      - 'automate-prototype/**'
      - '.github/workflows/automate-prototype.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run automate.prototype tests
        working-directory: automate-prototype
        run: python -m pytest -q
