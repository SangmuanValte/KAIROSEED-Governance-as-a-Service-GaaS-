# GENESIS-ADR-001: declarative expectations, not an authorization grant.
adr_id: GENESIS-ADR-001
status: "PRODUCTION_NO"

epigraph:
  reference: "Job 12:7-9"
  translation: "KJV"
  opening: "But ask now the beasts, and they shall teach thee;"
  principle: "Observe before claiming knowledge; seek authorization before acting."
  role: "Ethical reflection, not executable authorization"

governance:
  constraint: "M-001"
  human_authorization_required: true
  default_decision: "DENY"

assertions:
  - id: "7.1"
    name: "Unauthorized protected action"
    expected: "DENY"
    protected_state_delta: 0

  - id: "7.2"
    name: "Unverified computational provenance"
    expected: "UNVERIFIED"

  - id: "7.3"
    name: "Unverified execution receipt"
    expected: "REJECT"

production_authorized: false

reflection:
  reference: "Job 10:12 (KJV)"
  text: "Thou hast granted me life and favour, and thy visitation hath preserved my spirit."
  mapping:
    Life: "Capability"
    Favour: "Authorization"
    Visitation: "Independent Verification"
    Preservation: "Protected-State Integrity"
  invariant: "DENY ⇒ ΔS_protected = 0"
  role: "Spiritual reflection, not authorization mechanism"
  status: "Reflection accepted as proposed documentation. Not yet committed."
  governance: "GENESIS-ADR-001 | M-001 | Production: NO"
